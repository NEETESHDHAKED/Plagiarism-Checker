<!DOCTYPE html>
<html>
<head>
    <title>PlagX - Plagiarism Checker</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; text-align: center; padding: 30px; }
       .box { background: white; padding: 30px; border-radius: 12px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { margin: 15px 0; }
        button { background: #4CAF50; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
       .result { margin-top: 20px; font-size: 22px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>PlagX - AI Plagiarism Checker</h2>
        <p>Topic: Academic Assignment Plagiarism Detection</p>
        <form method="POST" enctype="multipart/form-data">
            <label>File 1 (Original):</label><br>
            <input type="file" name="file1" accept=".pdf,.txt,.jpg,.jpeg,.png" required><br>
            <label>File 2 (Student Copy):</label><br>
            <input type="file" name="file2" accept=".pdf,.txt,.jpg,.jpeg,.png" required><br>
            <button type="submit">Check Plagiarism</button>
        </form>

        {% if result %}
        <div class="result">
       <h3 style="color: {{ color }}">{{ result }}</h3>

            <p><small>{{ status }}</small></p>
        </div>
        {% endif %}
    </div>
</body>
</html>
